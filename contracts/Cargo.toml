[workspace]
resolver = "2"
members = ["showcase"]

[workspace.dependencies]
soroban-sdk = "25"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release but keeps debug assertions and logs, for diagnosing a
# contract's behaviour on a test network.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
