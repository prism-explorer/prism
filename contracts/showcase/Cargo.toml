[package]
name = "prism-showcase"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "A Soroban contract that exercises every kind of on-chain data Prism renders"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
